[tool.poetry]
name = "translation-agent"
version = "0.1.0"
description = "Agentic workflow for machine translation using LLMs"
authors = ["Andrew Ng <ng@deeplearning.ai>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "translation_agent", from = "src" }]
repository = "https://github.com/andrewyng/translation-agent"
keywords = ["translation", "agents", "LLM", "machine translation"]

[tool.poetry.dependencies]
python = "^3.9"
openai = "^1.28.1"
tiktoken = "^0.6.0"
joblib = "^1.4.2"
pysrt = "^1.1.2"
icecream = "^2.1.3"
langchain-text-splitters = "^0.0.1"
python-dotenv = "^1.0.1"
simplemma = { version = "^1.0.0", optional = true }
gradio = { version = "4.37.2", optional = true }
python-docx = { version = "^1.1.2", optional = true }
PyMuPDF = { version = "^1.24.7", optional = true }
black = { version = "^24.4.2", optional = true }
flake8 = { version = "^7.0.0", optional = true }
pyright = { version = "^1.1.362", optional = true }
pre-commit = { version = "^3.7.1", optional = true }
ruff = { version = "^0.4.4", optional = true }
pytest = { version = "^8.2.0", optional = true }
mypy = { version = "^1.10.0", optional = true }
pytest-mock = { version = "^3.14.0", optional = true }
nltk = { version = "^3.8.1", optional = true }
sacrebleu = { version = "^2.4.2", optional = true }
google-cloud-translate = { version = "^3.15.3", optional = true }
deepl = { version = "^1.18.0", optional = true }
numpy = { version = "^1.26.4", optional = true }
scipy = { version = "^1.13.0", optional = true }
requests = { version = "^2.32.3", optional = true }
beautifulsoup4 = { version = "^4.12.3", optional = true }
sentencepiece = { version = "^0.2.0", optional = true }

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/nightly/rocm6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
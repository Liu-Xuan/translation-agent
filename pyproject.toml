[tool.poetry]
name = "translation-agent"
version = "0.1.0"
description = "翻译代理服务，支持多种大语言模型"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.8.1,<4.0"
openai = "^1.12.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
aiohttp = "^3.9.1"
asyncio = "^3.4.3"
pytest-asyncio = "^0.23.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=translation_agent"
asyncio_mode = "auto"